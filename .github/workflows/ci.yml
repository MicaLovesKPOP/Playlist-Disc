name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: pdv1 validate-catalog catalog
      - run: pdv1 export-catalog catalog --output /tmp/catalog.json
      - run: pdv1 export-library catalog --output /tmp/library.json
      - run: pdv1 search-catalog "diagnostic beacon" --catalog catalog --json
      - run: pdv1 pack-list catalog
      - run: pdv1 pack-show draft-0-2-test-vectors --catalog catalog --json
      - run: pdv1 build 999901 --output /tmp/PD1-999901
      - run: pdv1 verify-build /tmp/PD1-999901
      - run: pdv1 build 999901 --no-cdtext --output /tmp/PD1-999901-no-cdtext
      - run: pdv1 verify-build /tmp/PD1-999901-no-cdtext
      - run: pdv1 build-test-kit --output /tmp/pdv1-test-kit
      - run: pdv1 verify-test-kit /tmp/pdv1-test-kit
      - run: pdv1 bridge-validate tests/vectors/bridge-session.jsonl
      - run: >-
          pdv1 host-replay tests/vectors/host-adapter-session.jsonl
          --plan tests/vectors/host-playback-plan.json
          --output /tmp/host-actions.jsonl
      - run: pdv1 validate-compatibility compatibility
      - run: pdv1 export-compatibility compatibility --output /tmp/compatibility.json
      - run: pdv1 validate-provider-index tests/vectors/provider-index-demo.json
      - run: pdv1 plan-playback 999901 --provider demo --output /tmp/diagnostic-plan.json
      - run: pytest tests/test_local_scan.py
      - run: >-
          pdv1 local-create /tmp/pdv1-local
          --title "CI private playlist"
          --short-title "CI PRIVATE"
          --binding local=library:playlist:ci
      - run: pdv1 local-validate /tmp/pdv1-local
      - run: pdv1 build 900000 --local-library /tmp/pdv1-local --output /tmp/PD1-900000
      - run: pdv1 verify-build /tmp/PD1-900000

  exhaustive-encoding-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: pdv1 audit-encoding


  static-library-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: pdv1 build-site catalog --output /tmp/pdv1-site
      - run: pdv1 verify-site /tmp/pdv1-site


  catalog-evolution-guard:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Compare protected public identities with baseline
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "No baseline commit available; skipping evolution comparison."
            exit 0
          fi
          git worktree add --detach /tmp/pdv1-base "$BASE_SHA"
          pdv1 check-catalog-evolution /tmp/pdv1-base/catalog catalog


  package-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build
      - if: runner.os == 'Linux'
        run: python -m twine check dist/*
      - name: Install built wheel
        run: >-
          python -c "import glob, subprocess, sys;
          wheels=glob.glob('dist/*.whl'); assert len(wheels)==1, wheels;
          subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall',wheels[0]])"
      - run: pdv1 inspect 999901
      - name: Verify packaged schemas
        run: >-
          python -c "from playlistdisc.bridge import load_bridge_schema;
          from playlistdisc.playback import load_playback_plan_schema;
          from playlistdisc.resolver import load_provider_index_schema;
          from playlistdisc.host import load_host_action_schema;
          assert load_bridge_schema()['title'];
          assert load_playback_plan_schema()['title'];
          assert load_provider_index_schema()['title'];
          assert load_host_action_schema()['title']"


  local-library-extra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[local-library,dev]'
      - run: pytest tests/test_local_scan.py


  cdrdao-parser-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - name: Install cdrdao reference mastering tool
        run: |
          sudo apt-get update
          sudo apt-get install -y cdrdao
      - run: pdv1 build-test-kit --output /tmp/pdv1-test-kit
      - name: Parse every generated TOC with cdrdao
        shell: bash
        run: |
          set -euo pipefail
          for toc in /tmp/pdv1-test-kit/variants/*/disc.toc; do
            echo "Checking $toc"
            pdv1 cdrdao-preflight "$toc" --verbose
          done
