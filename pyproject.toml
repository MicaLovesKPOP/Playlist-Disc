[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playlist-disc"
version = "0.2.0a1"
description = "Reference implementation and catalog tooling for the Playlist Disc (PDv1) physical playlist format."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Playlist Disc contributors"}]
keywords = ["audio-cd", "car-audio", "playlist", "cd-da", "oem"]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.21",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
local-library = ["mutagen>=1.47"]
dev = ["pytest>=8.0", "mutagen>=1.47"]
release = ["build>=1.2", "twine>=5.1"]

[project.urls]
Homepage = "https://github.com/MicaLovesKPOP/Playlist-Disc"
Repository = "https://github.com/MicaLovesKPOP/Playlist-Disc"
Issues = "https://github.com/MicaLovesKPOP/Playlist-Disc/issues"

[project.scripts]
pdv1 = "playlistdisc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
playlistdisc = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
